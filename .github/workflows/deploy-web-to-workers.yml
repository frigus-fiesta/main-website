name: Automated Web App Deployment to Cloudflare Workers

on:
  push:
    branches:
      - workers-deployable/main
  pull_request:
    branches:
      - workers-deployable/main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      RAZORPAY_LIVE_KEY_ID: ${{secrets.RAZORPAY_LIVE_KEY_ID}}
      RAZORPAY_LIVE_KEY_SECRET: ${{secrets.RAZORPAY_LIVE_KEY_SECRET}}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build OpenNext output
        run: bunx opennextjs-cloudflare build

      - name: Install wrangler CLI globally
        run: bun add -g wrangler

      - name: Deploy to Cloudflare Workers
        run: bun run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
